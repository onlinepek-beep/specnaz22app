<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Спецназ 22 — Вход</title>
<style>
:root{--bg:#0D0D0D;--card:#1A1A1A;--field:#222;--text:#F2F2F2;--secondary:#999;--border:rgba(255,255,255,.08);--error:#D46A6A}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.login-card{width:100%;max-width:420px;padding:36px;background:var(--card);border:1px solid var(--border);border-radius:28px}.logo{text-align:center;font-size:28px;font-weight:600;margin-bottom:8px}.subtitle{text-align:center;color:var(--secondary);font-size:14px;margin-bottom:32px}.field{margin-bottom:18px}label{display:block;margin-bottom:8px;color:var(--secondary);font-size:13px}
select,input{width:100%;height:52px;padding:0 16px;border:1px solid var(--border);border-radius:14px;background:var(--field);color:var(--text);font-size:16px;outline:none}select{cursor:pointer}option{background:#222;color:#F2F2F2}button{width:100%;height:52px;margin-top:8px;border:0;border-radius:14px;background:#F2F2F2;color:#111;font-size:16px;font-weight:600;cursor:pointer}.error{margin-top:16px;color:var(--error);text-align:center;font-size:14px}.credentials{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);color:var(--secondary);font-size:12px;line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="login-card">
<div class="logo">Спецназ 22</div>
<div class="subtitle">Учёт производства</div>
<form action="/login" method="post">
<div class="field"><label for="username">Пользователь</label><select id="username" name="username" required>
<option value="manager">Руководитель</option>
<option value="operator">Оператор</option>
<option value="admin">Администратор</option>
</select></div>
<div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" placeholder="Введите пароль" required></div>
<button type="submit">Войти</button>
</form>
<div class="credentials">Руководитель: manager / manager<br>Оператор: operator / operator<br>Администратор: admin / admin</div>
</div>
<script>
const params=new URLSearchParams(location.search);
if(params.get("error")==="1"){const e=document.createElement("div");e.className="error";e.textContent="Неверный пользователь или пароль";document.querySelector(".login-card").appendChild(e);}
</script>
</body>
</html>
